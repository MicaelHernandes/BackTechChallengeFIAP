apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-config
  namespace: laravel
data:
  APP_NAME: "Oficina"
  APP_ENV: "production"
  APP_DEBUG: "false"
  # ATENÇÃO: Ajuste para o domínio/IP real de acesso externo antes de aplicar.
  # Usado para gerar os links assinados de aprovação/rejeição de orçamento
  # enviados por e-mail (URL::temporarySignedRoute) — se ficar com o valor
  # padrão do .env.example, o cliente recebe um link para "localhost".
  APP_URL: "http://CHANGE-ME.exemplo.com"
  APP_PORT: "80"
  VITE_PORT: "5173"
  LARAVEL_SAIL: "1"
  XDEBUG_MODE: "off"
  XDEBUG_CONFIG: "client_host=host.docker.internal"

  # Database
  DB_CONNECTION: "pgsql"
  DB_HOST: "pgsql"
  DB_PORT: "5432"
  DB_DATABASE: "laravel"
  DB_USERNAME: "laravel"

  # Redis (cache, sessão e filas)
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CACHE_STORE: "redis"
  SESSION_DRIVER: "redis"
  QUEUE_CONNECTION: "redis"

  # Mail (Mailpit)
  MAIL_MAILER: "smtp"
  MAIL_HOST: "mailpit"
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: "hello@example.com"
  MAIL_FROM_NAME: "Laravel"

  # MinIO (S3-compatible)
  FILESYSTEM_DISK: "s3"
  AWS_ENDPOINT: "http://minio:9000"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_BUCKET: "laravel"
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
