apiVersion: v1
kind: Service
metadata:
  name: laravel-app
  namespace: laravel
  labels:
    app: laravel-app
spec:
  selector:
    app: laravel-app
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: vite
      port: 5173
      targetPort: 5173
  type: ClusterIP
---
# Expõe a aplicação externamente via LoadBalancer
# Troque por Ingress se preferir (ver ingress.yaml)
apiVersion: v1
kind: Service
metadata:
  name: laravel-app-external
  namespace: laravel
spec:
  selector:
    app: laravel-app
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: LoadBalancer
