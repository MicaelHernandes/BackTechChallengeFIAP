apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
  namespace: laravel
  labels:
    app: laravel-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: laravel-app
  template:
    metadata:
      labels:
        app: laravel-app
    spec:
      initContainers:
        # Aguarda o banco estar pronto antes de iniciar
        - name: wait-for-pgsql
          image: postgres:18-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h pgsql -U $(DB_USERNAME) -d $(DB_DATABASE); do
                echo "Aguardando PostgreSQL...";
                sleep 2;
              done
          env:
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: laravel-config
                  key: DB_USERNAME
            - name: DB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: laravel-config
                  key: DB_DATABASE

        # Roda migrations na inicialização
        - name: laravel-migrate
          image: backtechchallenge/laravel-app:local
          imagePullPolicy: IfNotPresent
          command: ["php", "artisan", "migrate", "--force"]
          envFrom:
            - configMapRef:
                name: laravel-config
            - secretRef:
                name: laravel-secrets

      containers:
        - name: laravel-app
          image: backtechchallenge/laravel-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
            - containerPort: 5173
              name: vite
          envFrom:
            - configMapRef:
                name: laravel-config
            - secretRef:
                name: laravel-secrets
          env:
            - name: WWWUSER
              value: "1000"
            - name: WWWGROUP
              value: "1000"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
