apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: laravel

resources:
  # Namespace
  - namespace.yaml

  # Configurações
  - config/configmap.yaml
  - config/secret.yaml

  # Banco de dados
  - pgsql/statefulset.yaml

  # Cache / Queues
  - redis/statefulset.yaml

  # Mail (dev/staging)
  - mailpit/deployment.yaml

  # Object Storage
  - minio/statefulset.yaml

  # Aplicação Laravel
  - app/migrate-job.yaml
  - app/deployment.yaml
  - app/service.yaml
  - app/queue-worker.yaml
  - app/scheduler.yaml
  - app/hpa.yaml

  # Nginx reverse proxy (DaemonSet: uma instância por node, evita SPOF)
  - nginx/daemonset.yaml
