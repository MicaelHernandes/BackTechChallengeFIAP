apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-nginx-proxy-config
  namespace: laravel
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location / {
        proxy_pass http://laravel-app.laravel.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-nginx-proxy
  namespace: laravel
  labels:
    app: laravel-nginx-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-nginx-proxy
  template:
    metadata:
      labels:
        app: laravel-nginx-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              hostPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
      volumes:
        - name: nginx-config
          configMap:
            name: laravel-nginx-proxy-config
