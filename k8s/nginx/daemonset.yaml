apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-nginx-proxy-config
  namespace: laravel
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      # Health check do próprio nginx, sem depender do backend — usado pelas
      # probes do pod. Se apontasse pra "/", um app Laravel lento/reiniciando
      # derrubaria a probe do proxy junto, mesmo com o nginx saudável.
      location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
      }

      location / {
        proxy_pass http://laravel-app.laravel.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: laravel-nginx-proxy
  namespace: laravel
  labels:
    app: laravel-nginx-proxy
spec:
  selector:
    matchLabels:
      app: laravel-nginx-proxy
  template:
    metadata:
      labels:
        app: laravel-nginx-proxy
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              hostPort: 80
              name: http
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: laravel-nginx-proxy-config
